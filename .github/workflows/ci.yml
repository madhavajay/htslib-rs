name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Apply noodles compatibility patch
        run: git -C noodles apply -p1 ../patches/noodles-htslib-rs.patch

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

  htslib-c-tests:
    name: HTSlib C tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-suggests --no-install-recommends \
            autoconf \
            automake \
            gcc \
            libbz2-dev \
            libcurl4-gnutls-dev \
            libdeflate-dev \
            liblzma-dev \
            libssl-dev \
            make \
            perl \
            zlib1g-dev

      - name: Configure HTSlib
        working-directory: htslib
        run: |
          autoreconf -i
          ./configure --enable-plugins --with-libdeflate

      - name: Build HTSlib
        working-directory: htslib
        run: make -j"$(nproc)"

      - name: HTSlib C tests
        working-directory: htslib
        run: make check
